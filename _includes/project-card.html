<a href="{{ include.project.url | relative_url }}" class="project-card">

    {% if include.project.image %}
        <div class="project-card-image">
            <img src="{{ include.project.image | relative_url }}"
                 alt="{{ include.project.title }}">
        </div>
    {% endif %}

    <div class="project-card-content">

        <h2>{{ include.project.title }}</h2>

        {% if include.project.description %}
            <p>{{ include.project.description }}</p>
        {% endif %}

        {% if include.project.date %}
            <time datetime="{{ include.project.date | date_to_xmlschema }}">
                {{ include.project.date | date: "%B %d, %Y" }}
            </time>
        {% endif %}

    </div>

</a>
