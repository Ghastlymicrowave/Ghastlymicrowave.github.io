<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>{{ page.title }} — {{ site.title }}</title>

    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

<header>
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav>
        <a href="{{ '/projects/' | relative_url }}">Games</a>
        <a href="{{ '/art/' | relative_url }}">Art</a>
    </nav>
</header>

<main>

    <article class="project-post">

        <header class="project-post-header">
            <h1>{{ page.title }}</h1>

            {% if page.date %}
            <time datetime="{{ page.date | date_to_xmlschema }}">
                {{ page.date | date: "%B %d, %Y" }}
            </time>
            {% endif %}
        </header>

        <div class="project-content">
            {{ content }}
        </div>

    </article>

    <nav class="post-navigation">
        <a href="{{ '/projects/' | relative_url }}">← Back to Games</a>
    </nav>

</main>

</body>
</html>
